[build]
  command = "npm run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/studio"
  to = "/studio/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/studio/art/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
